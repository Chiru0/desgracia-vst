name: Build Windows VST3

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64, MSVC)
        run: cmake -B build -A x64 -DDESGRACIA_BUILD_TESTS=ON

      - name: Build VST3 + Standalone + test tool
        run: cmake --build build --config Release --parallel --target Desgracia_VST3 Desgracia_Standalone DesgraciaTest

      - name: Run audio / MIDI / state tests on Windows
        shell: pwsh
        run: |
          ./build/DesgraciaTest_artefacts/Release/DesgraciaTest.exe "$env:RUNNER_TEMP/renders"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Validate VST3 with pluginval
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 7 --skip-gui-tests --timeout-ms 300000 --validate "build/Desgracia_artefacts/Release/VST3/Desgracia.vst3"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Export preset bank as files
        shell: pwsh
        run: ./build/DesgraciaTest_artefacts/Release/DesgraciaTest.exe "package/Presets" --export-presets

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item -Recurse build/Desgracia_artefacts/Release/VST3/Desgracia.vst3 package/
          Copy-Item build/Desgracia_artefacts/Release/Standalone/*.exe package/ -ErrorAction SilentlyContinue
          Copy-Item installer/INSTALAR.bat, docs/INSTALACION.md, docs/MOTOR.md, README.md package/
          Compress-Archive -Path package/* -DestinationPath Desgracia-Windows-x64.zip -Force

      - name: Build installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer/desgracia.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desgracia-VST3-Windows-x64
          path: |
            Desgracia-Windows-x64.zip
            installer/Output/*.exe

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          $files = @("Desgracia-Windows-x64.zip") + (Get-ChildItem installer/Output/*.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          gh release create latest $files --title "Desgracia (ultimo build)" --notes "Build automatico de ${{ github.sha }}. Bajate el instalador .exe o el .zip." --target ${{ github.sha }}
